<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" role="img" aria-label="Hours on a full 57 Wh battery. In use: GNOME about 9 hours at 6.4 W, Loaf about 9½ hours at 5.9 W. Idle: GNOME about 13 hours at 4.4 W, Loaf about 13 hours at 4.4 W.">
<text x="16" y="24" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:13px" fill="#6E6A62">In use: browser scrolling, a video, switching tabs</text>
