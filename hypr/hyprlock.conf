# Loaf lock (v1 fallback until the Quickshell lock exists). Finger or password, no animations.
general {
    hide_cursor = true
}
animations {
    enabled = false
}
auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Touch the sensor or type your password
        present_message = Reading finger
    }
}
background {
    monitor =
    color = rgb(16, 20, 24)
}
label {
    monitor =
    text = cmd[update:60000] date +%H:%M
    color = rgb(221, 226, 230)
    font_size = 96
    font_family = Inter Light
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(140, 152, 162)
    font_size = 14
    font_family = Inter
    position = 0, -10
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    rounding = 14
    inner_color = rgba(255, 255, 255, 0.04)
    outer_color = rgba(221, 226, 230, 0.25)
    check_color = rgba(221, 226, 230, 0.6)
    fail_color = rgb(204, 102, 102)
    font_color = rgb(221, 226, 230)
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}
