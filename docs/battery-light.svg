<line x1="16" y1="260" x2="704" y2="260" stroke="#DED8CC" stroke-width="1.5"/>
<text x="16.0" y="280" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#A09A8F">0 h</text>
<text x="153.6" y="280" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#A09A8F">3 h</text>
