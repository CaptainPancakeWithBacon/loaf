<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-label="Idle time on a full 57 Wh battery: GNOME about 9 hours at 6.3 W, Loaf about 10.4 to 11.4 hours at 5.0 to 5.5 W">
<rect x="16" y="14" width="516.0" height="44" rx="22" fill="none" stroke="#5A5A57" stroke-width="1.5"/>
<text x="34" y="41" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600" fill="#A3A39E">GNOME</text>
<text x="514.0" y="41" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px" fill="#A3A39E">9 hours at 6.3 W</text>
<rect x="16" y="72" width="653.6" height="44" rx="22" fill="#ECECEA"/>
<text x="34" y="99" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600" fill="#121212">Loaf</text>
<text x="651.6" y="99" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px" fill="#121212">10½ to 11½ hours at 5.0 to 5.5 W</text>
<line x1="16" y1="138" x2="704" y2="138" stroke="#2E2E2C" stroke-width="1.5"/>
<text x="16.0" y="160" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">0 h</text>
<text x="188.0" y="160" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">3 h</text>
<text x="360.0" y="160" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">6 h</text>
<text x="532.0" y="160" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">9 h</text>
<text x="704.0" y="160" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">12 h</text>
<text x="16" y="184" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:12px" fill="#A3A39E">Idle, Framework 13 (Ryzen AI 300), 57 Wh battery</text>
</svg>
