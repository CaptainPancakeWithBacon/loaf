<text x="407.8" y="59" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px" fill="#6E6A62">about 9 hours at 6.4 W</text>
<rect x="16" y="82" width="444.6" height="40" rx="20" fill="#151515"/>
<text x="34" y="107" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600" fill="#F1EDE4">Loaf</text>
<text x="442.6" y="107" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px" fill="#F1EDE4">about 9½ hours at 5.9 W</text>
<text x="16" y="148" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:13px" fill="#6E6A62">Idle: nothing open, after settling</text>
<rect x="16.75" y="158.75" width="588.7" height="38.5" rx="19.25" fill="none" stroke="#A09A8F" stroke-width="1.5"/>
<text x="34" y="183" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600" fill="#6E6A62">GNOME</text>
<text x="588.2" y="183" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px" fill="#6E6A62">about 13 hours at 4.4 W</text>
<rect x="16" y="206" width="592.8" height="40" rx="20" fill="#151515"/>
