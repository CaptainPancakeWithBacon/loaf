# Loaf / niri only (see session/hypridle-niri-only.conf). Event-driven: ext-idle-notify, no polling.
general {
    # Loaf's lock; if Loaf is not running (qs ipc fails), hyprlock locks instead
    lock_cmd = qs ipc -c loaf call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = sh -c 'qs ipc -c loaf call lock sleep; loginctl lock-session'
    after_sleep_cmd = sh -c 'niri msg action power-on-monitors; qs ipc -c loaf call lock wake'
}
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
listener {
    timeout = 330
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
listener {
    # suspend only on battery; docked/charging stays awake
    timeout = 1800
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ACAD/online)" = 0 ] && systemctl suspend'
}
