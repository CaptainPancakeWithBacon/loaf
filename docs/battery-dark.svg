<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" role="img" aria-label="Hours on a full 57 Wh battery. In use: GNOME about 9 hours at 6.4 W, Loaf about 9½ hours at 5.9 W. Idle: GNOME about 13 hours at 4.4 W, Loaf about 13 hours at 4.4 W.">
<text x="16" y="24" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:13px" fill="#A3A39E">In use: browser scrolling, a video, switching tabs</text>
<rect x="16.75" y="34.75" width="408.3" height="38.5" rx="19.25" fill="none" stroke="#5A5A57" stroke-width="1.5"/>
<text x="34" y="59" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600" fill="#A3A39E">GNOME</text>
<text x="407.8" y="59" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px" fill="#A3A39E">about 9 hours at 6.4 W</text>
<rect x="16" y="82" width="444.6" height="40" rx="20" fill="#ECECEA"/>
<text x="34" y="107" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600" fill="#121212">Loaf</text>
<text x="442.6" y="107" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px" fill="#121212">about 9½ hours at 5.9 W</text>
<text x="16" y="148" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:13px" fill="#A3A39E">Idle: nothing open, after settling</text>
<rect x="16.75" y="158.75" width="588.7" height="38.5" rx="19.25" fill="none" stroke="#5A5A57" stroke-width="1.5"/>
<text x="34" y="183" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600" fill="#A3A39E">GNOME</text>
<text x="588.2" y="183" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px" fill="#A3A39E">about 13 hours at 4.4 W</text>
<rect x="16" y="206" width="592.8" height="40" rx="20" fill="#ECECEA"/>
<text x="34" y="231" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600" fill="#121212">Loaf</text>
<text x="590.8" y="231" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px" fill="#121212">about 13 hours at 4.4 W</text>
<line x1="16" y1="260" x2="704" y2="260" stroke="#2E2E2C" stroke-width="1.5"/>
<text x="16.0" y="280" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">0 h</text>
<text x="153.6" y="280" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">3 h</text>
<text x="291.2" y="280" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">6 h</text>
<text x="428.8" y="280" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">9 h</text>
<text x="566.4" y="280" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">12 h</text>
<text x="704.0" y="280" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px" fill="#5A5A57">15 h</text>
<text x="16" y="304" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:12px" fill="#A3A39E">Framework 13 (Ryzen AI 300), 57 Wh battery, 50% brightness</text>
</svg>
